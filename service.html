<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Home Appliance Repair in Bangalore | Fixlyn</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<section class="services">
  <h2 id="serviceTitle"></h2>

  <select id="problem"></select>

  <input type="text" id="name" placeholder="Your Name">
  <input type="tel" id="mobile" placeholder="Mobile Number">

  <div class="row">
  <input type="date" id="date">
  <select id="time">
    <option>10 AM - 12 PM</option>
    <option>12 PM - 2 PM</option>
    <option>2 PM - 4 PM</option>
    <option>4 PM - 6 PM</option>
  </select>
  </div>

  <button type="button" onclick="detectLocation()" id="locBtn">
  📍 Detect Location
</button>

<span id="locLoading" style="display:none;">Detecting location...</span>

  <input id="area" placeholder="Area">
  <input id="pincode" placeholder="Pincode">

  <input id="building" placeholder="Apartment / Building">
  <input id="flat" placeholder="Flat / Room No">
  <textarea id="address" placeholder="Full Address"></textarea>

  <button type="button" onclick="sendWhatsApp()" class="book-btn">
  Book on WhatsApp
</button>

<script src="js/service.js"></script>
</body>
</html>
